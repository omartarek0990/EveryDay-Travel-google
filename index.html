<!-- ========== (1) جوه <head> ========== -->
<style>
  html.app-loading, html.app-loading body { overflow: hidden; }

  #app-loader {
    --al-brand: #F2541B;            /* ← لون الضل والموجة (آخر التدرج) */
    /* ألوان التدرج نفسه في <linearGradient id="al-grad"> تحت، و.al-word */
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #fff;
    color: var(--al-brand);
    transition: opacity .45s ease, visibility 0s linear .45s;
  }
  #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #app-loader svg { width: 120px; height: auto; overflow: visible; animation: al-loop 3s infinite; }

  .al-pin     { transform-box: fill-box; transform-origin: 50% 100%; animation: al-drop 3s infinite; }
  .al-outline { stroke-dasharray: 1; animation: al-draw1 3s infinite; }
  .al-spiral  { stroke-dasharray: 1; animation: al-draw2 3s infinite; }
  .al-shadow  { transform-box: fill-box; transform-origin: center; animation: al-shadow 3s infinite; }
  .al-r1, .al-r2 { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .al-r1 { animation: al-r1 3s infinite; }
  .al-r2 { animation: al-r2 3s infinite; }

  .al-word {
    font: 400 22px/1 system-ui, -apple-system, "Segoe UI", sans-serif; direction: ltr; animation: al-loop 3s infinite;
    background: linear-gradient(135deg, #FF9A1F 0%, #F2541B 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .al-word i { font-style: italic; }
  .al-word b { font-weight: 700; }

  /* اللفة كلها 3 ثواني: رسم في الهوا (0–42%) ← وقوع (42–56%) ← نطّتين ← ثبات ← اختفاء ناعم */
  @keyframes al-loop { 0%, 90% { opacity: 1; } 100% { opacity: 0; } }

  /* شكل الدبوس الخارجي بيترسم الأول، وبعده اللفة اللي جواه */
  @keyframes al-draw1 { 0% { stroke-dashoffset: 1; animation-timing-function: ease-in-out; } 30%, 100% { stroke-dashoffset: 0; } }
  @keyframes al-draw2 { 0%, 18% { stroke-dashoffset: 1; animation-timing-function: ease-in-out; } 42%, 100% { stroke-dashoffset: 0; } }

  @keyframes al-drop {
    0%       { transform: translateY(-24px) scale(1, 1);     animation-timing-function: ease-in-out; }
    21%      { transform: translateY(-27px) scale(1, 1);     animation-timing-function: ease-in-out; }   /* طفو خفيف وهو بيترسم */
    42%      { transform: translateY(-24px) scale(1, 1);     animation-timing-function: cubic-bezier(.55, 0, 1, .45); } /* يقع */
    56%      { transform: translateY(0)     scale(1, 1);     animation-timing-function: ease-out; }
    60%      { transform: translateY(0)     scale(1.12, .86); animation-timing-function: ease-out; }    /* يتفرطح */
    68%      { transform: translateY(-7px)  scale(.96, 1.04); animation-timing-function: ease-in; }     /* نطة */
    76%      { transform: translateY(0)     scale(1, 1);     animation-timing-function: ease-out; }
    81%      { transform: translateY(-2px)  scale(1, 1);     animation-timing-function: ease-in; }      /* نطة صغيرة */
    86%, 100% { transform: translateY(0)    scale(1, 1); }
  }
  @keyframes al-shadow {
    0%, 42%  { transform: scale(.35); opacity: .06; }
    56%      { transform: scale(1);   opacity: .18; }
    68%      { transform: scale(.75); opacity: .12; }
    76%, 100% { transform: scale(1);  opacity: .18; }
  }
  @keyframes al-r1 { 0%, 55% { transform: scale(.3); opacity: 0; } 57% { opacity: .8; }  85%, 100% { transform: scale(2.8); opacity: 0; } }
  @keyframes al-r2 { 0%, 63% { transform: scale(.3); opacity: 0; } 65% { opacity: .55; } 93%, 100% { transform: scale(2.8); opacity: 0; } }

  /* تقليل الحركة: الدبوس كامل وثابت مع نبض هادي */
  @media (prefers-reduced-motion: reduce) {
    #app-loader svg, .al-word, .al-pin, .al-outline, .al-spiral, .al-shadow { animation: none; }
    .al-outline, .al-spiral { stroke-dashoffset: 0; }
    .al-r1, .al-r2 { display: none; }
    #app-loader svg { animation: al-fade 1.2s ease-in-out infinite alternate; }
    @keyframes al-fade { from { opacity: .5; } to { opacity: 1; } }
  }
</style>
  </head>
  <body class="bg-surface text-ink antialiased selection:bg-brand-100 selection:text-brand-700">
<!-- ========== (2) أول حاجة جوه <body> ========== -->
<div id="app-loader" role="status" aria-live="polite" aria-label="جارِ التحميل">
  <svg viewBox="0 0 120 140" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="al-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF9A1F" />
        <stop offset="1" stop-color="#F2541B" />
      </linearGradient>
    </defs>
    <ellipse class="al-shadow" cx="60" cy="112" rx="14" ry="4" fill="currentColor" />
    <ellipse class="al-r1" cx="60" cy="110" rx="12" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" />
    <ellipse class="al-r2" cx="60" cy="110" rx="12" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" />
    <g transform="translate(33 50) scale(1.5)">
      <g class="al-pin" fill="none" stroke="url(#al-grad)" stroke-linejoin="round" stroke-linecap="round">
        <path class="al-outline" pathLength="1" stroke-width="2.8"
          d="M18 3C10.5 3 4.5 9 4.5 16.5C4.5 26 15.2 36.8 17.3 38.8C17.7 39.2 18.3 39.2 18.7 38.8C20.8 36.8 31.5 26 31.5 16.5C31.5 9 25.5 3 18 3Z" />
        <path class="al-spiral" pathLength="1" stroke-width="2.3"

      </g>
    </g>
  </svg>
  <div class="al-word" aria-hidden="true"><i>every</i><b>Day</b></div>
</div>

<!-- ========== (3) بعد الـ div على طول ========== -->
<script>
  (function () {
    var root = document.documentElement;
    var el = document.getElementById('app-loader');
    if (!el) return;

    // الداش بورد مش محتاج لودر (عدّل المسار لو الأدمن على مسار تاني)
    if (location.pathname.indexOf('/admin') === 0) { el.remove(); return; }

    if (location.pathname.indexOf('/en') === 0) el.setAttribute('aria-label', 'Loading');
    root.classList.add('app-loading');

    window.__hideAppLoader = function () {
      if (!el || el.getAttribute('data-hiding')) return;
      el.setAttribute('data-hiding', '1');
      clearTimeout(window.__appLoaderTimer);
      root.classList.remove('app-loading');
      el.classList.add('is-hidden');
      setTimeout(function () { if (el) { el.remove(); el = null; } }, 600);
    };

    // Failsafe: مهما حصل (نت بطيء، API واقع، JS اتكسر) اللودر يختفي بعد 3 ثواني
    window.__appLoaderTimer = setTimeout(window.__hideAppLoader, 3000);
  })();
</script>
